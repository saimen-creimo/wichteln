<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F4D3A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E">
<title>Wichteln</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F3EC; --card:#FFFFFF; --ink:#1E2A24; --muted:#6B746F; --line:#E7E1D6;
  --green:#1F4D3A; --green-2:#2E6B52; --green-soft:#E6EFE9;
  --red:#B3362C; --red-soft:#F8E7E4; --gold:#C49A2C; --gold-soft:#F6EEDA;
  --r:16px; --shadow:0 1px 2px rgba(30,42,36,.05),0 4px 16px rgba(30,42,36,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:28px}h2{font-size:21px}h3{font-size:17px}
a{color:var(--green-2)}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 80px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.top .logo{width:36px;height:36px;border-radius:11px;background:var(--green);display:grid;place-items:center;flex:none}
.top .brand{font-family:Fraunces,serif;font-size:20px;font-weight:600;cursor:pointer}
.top .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:0;border-radius:12px;padding:11px 16px;font:600 15px Inter,sans-serif;cursor:pointer;background:var(--green);color:#fff;transition:transform .05s,background .15s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{background:var(--green-2)}.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:var(--green-soft);color:var(--green)}
.btn.sec:hover{background:#d9e7de}
.btn.red{background:var(--red)}.btn.red:hover{background:#9b2c23}
.btn.ghost{background:transparent;color:var(--muted);padding:8px 10px}
.btn.ghost:hover{background:#efe9df}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--green-soft);color:var(--green);white-space:nowrap}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.gold{background:var(--gold-soft);color:#8a6a14}
.badge.grey{background:#EFEBE4;color:var(--muted)}
.proj{display:flex;gap:14px;align-items:center;cursor:pointer}
.proj:hover{border-color:#d5cdbf}
.proj .yr{font-family:Fraunces,serif;font-size:22px;font-weight:600;color:var(--green);width:58px;text-align:center;flex:none}
.hero{background:var(--green);color:#fff;border:0;position:relative;overflow:hidden}
.hero .muted{color:#cfe0d6}
.hero h1{color:#fff}
.hero .stars{position:absolute;right:-10px;top:-10px;opacity:.16;pointer-events:none}
.rules{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rules .chip{background:rgba(255,255,255,.12);border-radius:10px;padding:6px 10px;font-size:13px}
.steps{display:flex;gap:4px;margin-top:16px}
.steps div{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.2)}
.steps div.on{background:var(--gold)}
.steplabel{font-size:12px;margin-top:6px;color:#cfe0d6}
.tabs{display:flex;gap:6px;background:#EDE7DC;padding:4px;border-radius:14px;margin:4px 0 14px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 4px;white-space:nowrap;border-radius:11px;font:600 13px Inter,sans-serif;color:var(--muted);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.person{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex:none;font-size:14px}
.wish{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.wish:first-of-type{border-top:0}
.wish .n{width:26px;height:26px;border-radius:8px;background:var(--gold-soft);color:#8a6a14;font-weight:600;font-size:13px;display:grid;place-items:center;flex:none}
.wish.res .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:#c9c1b4}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.giftno{display:flex;align-items:center;gap:12px;background:var(--red-soft);border-radius:12px;padding:10px 14px;margin:10px 0 6px}
.giftno .num{font-family:Fraunces,serif;font-size:30px;font-weight:600;color:var(--red);line-height:1}
.notice{background:var(--gold-soft);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.notice.red{background:var(--red-soft)}
.notice.green{background:var(--green-soft)}
table{width:100%;border-collapse:collapse}
td,th{padding:10px 6px;border-top:1px solid var(--line);text-align:left;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:15px Inter,sans-serif;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--green-2);outline-offset:-1px;border-color:transparent}
textarea{min-height:70px;resize:vertical}
.pin{letter-spacing:.5em;text-align:center;font-size:20px;font-weight:600}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:1px}
/* Sheet */
.ov{position:fixed;inset:0;background:rgba(20,28,24,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px 28px;animation:up .2s ease-out}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .hd{display:flex;align-items:center;margin-bottom:6px}
.wrow{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.wrow .n{margin-top:10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.hr{height:1px;background:var(--line);margin:14px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 13h18"/><path d="M12 9c-1.5-3-5-4-5-1.5S10 9 12 9zM12 9c1.5-3 5-4 5-1.5S14 9 12 9z"/></svg></div>
    <div class="brand" onclick="go('')">Wichteln</div>
    <div class="sp"></div>
  </div>
  <div id="main"><div class="empty"><span class="spin"></span></div></div>
</div>
<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="draw.js"></script>
<script src="app.js"></script>
</body>
</html>
